<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Panel - Gubbi Hospital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <a href="index.html">Back to home</a>
    <h1>Staff panel</h1>
    <p>For hospital staff only.</p>
  </header>

  <section id="login-box" class="login">
    <h2>Staff login</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Staff email" required>
      <input type="password" id="password" placeholder="Password" required>
      <p class="error" id="login-error"></p>
      <button type="submit">Log in</button>
    </form>
  </section>

  <div id="staff-area" hidden>
    <p class="message" id="message">Click "Call next" when you are ready for the next patient.</p>
    <main class="panel" id="panel"></main>
    <div class="center">
      <button class="logout" id="logout-btn">Log out</button>
    </div>
  </div>

  <script type="module" src="staff.js"></script>
</body>
</html>
